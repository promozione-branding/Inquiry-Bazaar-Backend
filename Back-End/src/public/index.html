<!DOCTYPE html>
<html>
<head>
  <title>Inquiry Bazaar API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 12px;
      background: #1e293b;
      box-shadow: 0 0 20px rgba(0,0,0,.3);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }

    .password-wrapper {
      position: relative;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
    }

    button.login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button.login-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <img src="/logo.png" alt="Inquiry Bazaar Logo" class="logo">

    <h1>Inquiry Bazaar</h1>
    <p>Login to continue</p>

    <form>

      <div class="form-group">
        <input
          type="email"
          placeholder="Email Address"
          required
        >
      </div>

      <div class="form-group">
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          >
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword()"
          >
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById('password');

      if (password.type === 'password') {
        password.type = 'text';
      } else {
        password.type = 'password';
      }
    }
  </script>

</body>
</html>
